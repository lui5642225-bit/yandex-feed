name: Update Yandex Feed

on:
  schedule:
    # Запуск каждые 12 часов (в 00:00 и 12:00 по UTC)
    - cron: '0 0,12 * * *'
  # Позволяет нажать кнопку "Run" руками в любой момент
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run converter script
        run: python generate.py

      - name: Commit and push updated feed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update feed.xml" && git push)
